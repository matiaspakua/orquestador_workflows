  <rect x="162" y="118" width="140" height="28" rx="5" fill="white" stroke="#cbd5e0" stroke-width="1"/>
  <text x="174" y="137" fill="#a0aec0" font-size="12">Desde: 2026-01-01</text>
  <rect x="312" y="118" width="140" height="28" rx="5" fill="white" stroke="#cbd5e0" stroke-width="1"/>
