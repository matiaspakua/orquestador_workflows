  <rect x="48" y="316" width="86" height="20" rx="10" fill="#c6f6d5"/>
  <text x="58" y="330" fill="#276749" font-size="11" font-weight="600">COMPLETADO</text>
  <text x="160" y="332" fill="#2d3748" font-size="13">order-processing / ORD-00040</text>
  <text x="540" y="332" fill="#718096" font-size="12">2026-06-03 19:43:00</text>
  <text x="720" y="332" fill="#2d3748" font-size="12">0:25</text>
  <line x1="32" y1="342" x2="868" y2="342" stroke="#e2e8f0" stroke-width="1"/>

  <!-- row 5: Completed -->
  <rect x="48" y="354" width="86" height="20" rx="10" fill="#c6f6d5"/>
  <text x="58" y="368" fill="#276749" font-size="11" font-weight="600">COMPLETADO</text>
  <text x="160" y="370" fill="#2d3748" font-size="13">order-processing / ORD-00039</text>
  <text x="540" y="370" fill="#718096" font-size="12">2026-06-03 19:41:55</text>
