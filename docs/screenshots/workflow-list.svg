<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" font-family="'Segoe UI',sans-serif">
  <!-- bg -->
  <rect width="900" height="520" fill="#f5f5f5"/>
  <!-- header -->
  <rect width="900" height="56" fill="url(#hdr)"/>
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
    <linearGradient id="sidebar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
  </defs>
  <text x="24" y="35" fill="white" font-size="18" font-weight="600">Orquestador de Workflows</text>
