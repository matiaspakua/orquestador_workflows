  <line x1="32" y1="380" x2="868" y2="380" stroke="#e2e8f0" stroke-width="1"/>

  <!-- row 6: Failed (fraud) -->
  <rect x="48" y="392" width="68" height="20" rx="10" fill="#fed7d7"/>
  <text x="58" y="406" fill="#9b2c2c" font-size="11" font-weight="600">FALLIDO</text>
  <text x="160" y="408" fill="#2d3748" font-size="13">order-processing / ORD-00038</text>
  <text x="540" y="408" fill="#718096" font-size="12">2026-06-03 19:40:48</text>
  <text x="720" y="408" fill="#2d3748" font-size="12">0:04</text>
  <line x1="32" y1="418" x2="868" y2="418" stroke="#e2e8f0" stroke-width="1"/>

  <!-- pagination -->
  <rect x="32" y="435" width="72" height="28" rx="5" fill="white" stroke="#cbd5e0"/>
  <text x="51" y="454" fill="#4a5568" font-size="12">Anterior</text>
  <text x="120" y="454" fill="#718096" font-size="12">Página 1 / 3</text>
  <rect x="200" y="435" width="72" height="28" rx="5" fill="white" stroke="#cbd5e0"/>
  <text x="219" y="454" fill="#4a5568" font-size="12">Siguiente</text>

  <!-- SSE live indicator note -->
  <text x="32" y="498" fill="#a0aec0" font-size="11">● Actualizaciones en tiempo real via SSE — estado sincronizado sin recargar la página</text>
