<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" font-family="'Segoe UI',sans-serif">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#667eea"/>
    </marker>
    <marker id="arrow2" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f59e0b"/>
    </marker>
    <marker id="arrow3" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#10b981"/>
    </marker>
    <filter id="sh"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="rgba(0,0,0,0.15)"/></filter>
  </defs>
  <rect width="900" height="440" fill="#f8fafc"/>
  <text x="450" y="30" fill="#4a5568" font-size="18" font-weight="700" text-anchor="middle">Order Processing Workflow Architecture</text>

  <!-- Orchestrator box -->
  <rect x="340" y="52" width="220" height="64" rx="8" fill="url(#g1)" filter="url(#sh)"/>
  <text x="450" y="80" fill="white" font-size="15" font-weight="600" text-anchor="middle">Orchestrator</text>
  <text x="450" y="100" fill="rgba(255,255,255,0.8)" font-size="11" text-anchor="middle">Workflow lifecycle manager</text>

  <!-- Kafka box -->
  <rect x="340" y="164" width="220" height="60" rx="8" fill="#f59e0b" filter="url(#sh)"/>
  <text x="450" y="192" fill="white" font-size="15" font-weight="600" text-anchor="middle">Apache Kafka</text>
  <text x="450" y="212" fill="rgba(255,255,255,0.9)" font-size="11" text-anchor="middle">Message Broker (8 topics)</text>

  <!-- Arrow Orchestrator → Kafka (tasks) -->
  <line x1="450" y1="116" x2="450" y2="162" stroke="#667eea" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="455" y="130" width="74" height="18" rx="4" fill="white" stroke="#667eea" stroke-width="1"/>
  <text x="492" y="143" fill="#667eea" font-size="10" text-anchor="middle">task dispatch</text>

  <!-- Arrow Kafka → Orchestrator (results) -->
  <line x1="430" y1="162" x2="430" y2="118" stroke="#10b981" stroke-width="2" marker-end="url(#arrow3)"/>
  <rect x="336" y="130" width="72" height="18" rx="4" fill="white" stroke="#10b981" stroke-width="1"/>
  <text x="372" y="143" fill="#10b981" font-size="10" text-anchor="middle">results</text>

  <!-- Workers -->
  <!-- W1 -->
  <rect x="40" y="290" width="150" height="56" rx="8" fill="#3b82f6" filter="url(#sh)"/>
  <text x="115" y="317" fill="white" font-size="13" font-weight="600" text-anchor="middle">OrderValidator</text>
  <text x="115" y="335" fill="rgba(255,255,255,0.8)" font-size="10" text-anchor="middle">order-validation</text>

  <!-- W2 -->
  <rect x="220" y="290" width="150" height="56" rx="8" fill="#8b5cf6" filter="url(#sh)"/>
  <text x="295" y="317" fill="white" font-size="13" font-weight="600" text-anchor="middle">FraudChecker</text>
  <text x="295" y="335" fill="rgba(255,255,255,0.8)" font-size="10" text-anchor="middle">fraud-check</text>

  <!-- W3 -->
  <rect x="530" y="290" width="150" height="56" rx="8" fill="#06b6d4" filter="url(#sh)"/>
  <text x="605" y="317" fill="white" font-size="13" font-weight="600" text-anchor="middle">InventoryChecker</text>
  <text x="605" y="335" fill="rgba(255,255,255,0.8)" font-size="10" text-anchor="middle">inventory-check</text>

  <!-- W4 -->
  <rect x="710" y="290" width="150" height="56" rx="8" fill="#10b981" filter="url(#sh)"/>
  <text x="785" y="317" fill="white" font-size="13" font-weight="600" text-anchor="middle">NotificationSender</text>
  <text x="785" y="335" fill="rgba(255,255,255,0.8)" font-size="10" text-anchor="middle">notification-send</text>

  <!-- Kafka → Workers arrows -->
  <line x1="370" y1="224" x2="170" y2="288" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow2)"/>
  <line x1="400" y1="224" x2="310" y2="288" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow2)"/>
  <line x1="500" y1="224" x2="590" y2="288" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow2)"/>
  <line x1="530" y1="224" x2="770" y2="288" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow2)"/>

  <!-- PostgreSQL -->
  <rect x="700" y="52" width="160" height="64" rx="8" fill="#8b5cf6" filter="url(#sh)"/>
  <text x="780" y="80" fill="white" font-size="14" font-weight="600" text-anchor="middle">PostgreSQL</text>
  <text x="780" y="98" fill="rgba(255,255,255,0.8)" font-size="10" text-anchor="middle">workflow_executions</text>
  <text x="780" y="112" fill="rgba(255,255,255,0.8)" font-size="10" text-anchor="middle">workflow_steps</text>

  <!-- Orchestrator → PostgreSQL -->
  <line x1="560" y1="82" x2="698" y2="82" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="600" y="68" width="56" height="18" rx="4" fill="white" stroke="#8b5cf6" stroke-width="1"/>
  <text x="628" y="81" fill="#8b5cf6" font-size="10" text-anchor="middle">writes</text>

  <!-- Web UI -->
  <rect x="40" y="52" width="160" height="64" rx="8" fill="#10b981" filter="url(#sh)"/>
  <text x="120" y="80" fill="white" font-size="14" font-weight="600" text-anchor="middle">Web UI</text>
  <text x="120" y="98" fill="rgba(255,255,255,0.8)" font-size="10" text-anchor="middle">Flask + SSE</text>
  <text x="120" y="112" fill="rgba(255,255,255,0.8)" font-size="10" text-anchor="middle">localhost:5000</text>

  <!-- PostgreSQL → Web UI -->
  <line x1="340" y1="82" x2="202" y2="82" stroke="#10b981" stroke-width="2" marker-end="url(#arrow3)"/>
  <rect x="244" y="68" width="52" height="18" rx="4" fill="white" stroke="#10b981" stroke-width="1"/>
  <text x="270" y="81" fill="#10b981" font-size="10" text-anchor="middle">reads</text>

  <!-- Sequential labels -->
  <text x="450" y="406" fill="#718096" font-size="12" text-anchor="middle">Sequential step execution: each step waits for worker result before advancing</text>
  <text x="115" y="378" fill="#3b82f6" font-size="11" text-anchor="middle">✓ validates fields</text>
  <text x="295" y="378" fill="#8b5cf6" font-size="11" text-anchor="middle">✗ blocks &gt;$5,000</text>
  <text x="605" y="378" fill="#06b6d4" font-size="11" text-anchor="middle">✗ 10% stockout</text>
  <text x="785" y="378" fill="#10b981" font-size="11" text-anchor="middle">✓ always succeeds</text>
</svg>