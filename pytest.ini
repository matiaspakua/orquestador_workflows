[pytest]
# Feature 005-producer-consumer-test integration suite configuration.
# Repo root on sys.path so both test trees can `import tests_support`.
pythonpath = .

testpaths =
    producer/tests/integration
    consumer/tests/integration

python_files = test_*.py
python_classes = Test*
python_functions = test_*

# JUnit XML for CI consumption (T020 / SC-005). The full suite also enforces a
# per-test timeout so a hung Kafka client cannot stall the run (SC-001/SC-005).
addopts =
    -v
    --import-mode=importlib
    --junitxml=test-results/junit.xml
    --timeout=120

markers =
    docker: test manipulates sibling Docker containers (needs the docker socket)
    performance: throughput/benchmark test (SC-003)
    us1: User Story 1 - end-to-end message flow
    us2: User Story 2 - error handling and recovery
    us3: User Story 3 - orchestrator coordination
