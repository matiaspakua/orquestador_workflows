[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "orquestador-workflows"
version = "1.0.0"
description = "Event-driven microservice orchestration with real-time monitoring"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-timeout>=2.2",
    "pytest-cov>=5.0",
    "pytest-playwright>=0.4",
    "requests>=2.31",
    "grpcio>=1.62",
    "grpcio-tools>=1.62",
]
dev = [
    "ruff>=0.3",
    "mypy>=1.8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --import-mode=importlib"

[tool.ruff]
target-version = "py311"
line-length = 130

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["N802"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
