global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 5s

storage:
  tsdb:
    retention:
      time: 30d

rule_files:
  - "rules/*.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "producer"
    static_configs:
      - targets: ["producer:8000"]
    metrics_path: /metrics

  - job_name: "consumer"
    static_configs:
      - targets: ["consumer1:8000", "consumer2:8000"]
    metrics_path: /metrics

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: "web-ui"
    static_configs:
      - targets: ["web-ui:8000"]
    metrics_path: /metrics
