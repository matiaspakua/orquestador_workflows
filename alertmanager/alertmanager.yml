global:
  resolve_timeout: 5m

route:
  group_by: ["alertname", "severity"]
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 1h
  receiver: grafana-webhook

  routes:
    - matchers:
        - severity = "critical"
      receiver: grafana-webhook
      group_wait: 5s
      repeat_interval: 15m

receivers:
  - name: grafana-webhook
    webhook_configs:
      - url: "http://grafana:3000/api/alerts"
        send_resolved: true

inhibit_rules:
  - source_matchers:
      - severity = "critical"
    target_matchers:
      - severity = "warning"
    equal: ["alertname", "container"]
