services:
  postgres:
    image: postgres:15-alpine
    container_name: event-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eventuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eventpass}
      POSTGRES_DB: ${POSTGRES_DB:-eventdb}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init-db.sql
      - ./scripts/init-workflow-db.sql:/docker-entrypoint-initdb.d/02-init-workflow-db.sql
      - ./scripts/init-idempotency.sql:/docker-entrypoint-initdb.d/03-init-idempotency.sql
    networks:
      - event-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eventuser}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: event-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - event-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: event-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    volumes:
      - ./scripts/init-topics.sh:/scripts/init-topics.sh
    networks:
      - event-network
    healthcheck:
      test: ["CMD", "kafka-topics", "--list", "--bootstrap-server", "kafka:29092"]
      interval: 10s
      timeout: 10s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: event-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    networks:
      - event-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  producer:
    build: ./producer
    container_name: event-producer
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-eventuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eventpass}
      POSTGRES_DB: ${POSTGRES_DB:-eventdb}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BROKER:-kafka:29092}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-data-events}
      PRODUCER_INTERVAL: ${PRODUCER_INTERVAL:-5}
      METRICS_PORT: "8000"
    networks:
      - event-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pgrep", "-f", "app.py"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  consumer1:
    build: ./consumer
    container_name: event-consumer1
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      CONSUMER_ID: consumer-1
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-eventuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eventpass}
      POSTGRES_DB: ${POSTGRES_DB:-eventdb}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BROKER:-kafka:29092}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-data-events}
      KAFKA_GROUP_ID: ${CONSUMER_GROUP:-data-processors}
      CONSUMER_TIMEOUT: "30000"
      METRICS_PORT: "8000"
    networks:
      - event-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pgrep", "-f", "app.py"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  consumer2:
    build: ./consumer
    container_name: event-consumer2
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      CONSUMER_ID: consumer-2
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-eventuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eventpass}
      POSTGRES_DB: ${POSTGRES_DB:-eventdb}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BROKER:-kafka:29092}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-data-events}
      KAFKA_GROUP_ID: ${CONSUMER_GROUP:-data-processors}
      CONSUMER_TIMEOUT: "30000"
      METRICS_PORT: "8000"
    networks:
      - event-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pgrep", "-f", "app.py"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  orchestrator:
    build: ./orchestrator
    container_name: event-orchestrator
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-eventuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eventpass}
      POSTGRES_DB: ${POSTGRES_DB:-eventdb}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BROKER:-kafka:29092}
      WORKFLOW_INTERVAL: ${WORKFLOW_INTERVAL:-60}
      METRICS_PORT: "8000"
    networks:
      - event-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pgrep", "-f", "app.py"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  workers:
    build: ./workers
    container_name: event-workers
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BROKER:-kafka:29092}
      METRICS_PORT: "8000"
    networks:
      - event-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pgrep", "-f", "app.py"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M

  web-ui:
    build: ./ui
    container_name: event-web-ui
    depends_on:
      - postgres
    ports:
      - "5000:5000"
      - "50051:50051"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-eventuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eventpass}
      POSTGRES_DB: ${POSTGRES_DB:-eventdb}
      FLASK_DEBUG: "0"
      GRPC_PORT: "50051"
      GRPC_ENABLED: "1"
    networks:
      - event-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: event-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    networks:
      - event-network
    depends_on:
      - producer
      - consumer1
      - consumer2
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  grafana:
    image: grafana/grafana:10.4.0
    container_name: event-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    networks:
      - event-network
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: event-cadvisor
    ports:
      - "8082:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - event-network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  loki:
    image: grafana/loki:2.9.4
    container_name: event-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./loki:/etc/loki
      - loki_data:/loki
    networks:
      - event-network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

  promtail:
    image: grafana/promtail:2.9.4
    container_name: event-promtail
    volumes:
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./promtail:/etc/promtail
    command: -config.file=/etc/promtail/promtail.yml
    networks:
      - event-network
    depends_on:
      - loki
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: event-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager:/etc/alertmanager
    command: --config.file=/etc/alertmanager/alertmanager.yml
    networks:
      - event-network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: event-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@event.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "8081:80"
    networks:
      - event-network
    depends_on:
      - postgres
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

networks:
  event-network:
    driver: bridge

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  loki_data:
